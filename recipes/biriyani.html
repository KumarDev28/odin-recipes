<body>
    <h1>Chicken Biriyani</h1>
    <img src="../images/biriyani.jpg" height="310" width="310" alt="biriyani">

    <p>A fragrant and flavorful rice dish made with tender chicken, aromatic spices and basmati rice.</p>

    <h2>Ingredients</h2>
    <h3>For the chicken</h3>
    <ul>
        <li>Chicken- 1kg</li>
        <li>Yogurt- 1 cup</li>
        <li>Onion- 3 large</li>
        <li>Ginger-garlic paste- 2 tbsp</li>
        <li>Biriyani masala- 2 tbsp</li>
        <li>Salt- to taste</li>
    </ul>

</body>
